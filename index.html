<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="description" content="Controle particular de despesas, patrimônio, investimentos e empréstimos.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=20261012-1">
  <title>Controle das Finanças</title>
  <script>
    const loadScript=src=>new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=reject;document.head.appendChild(script)});
    window.addEventListener('DOMContentLoaded',async()=>{
      const authResponse=window.opener&&/(?:[?#&])(?:code|error|error_description)=/i.test(window.location.href);
      if(authResponse){
        document.title='Conectando à Microsoft';
        document.documentElement.classList.add('auth-bridge');
        await loadScript('./vendor/msal-redirect-bridge.min.js');
        await window.msalRedirectBridge.broadcastResponseToMainFrame();
      }else{
        await loadScript('./vendor/msal-browser.min.js');
        await loadScript('./vendor/xlsx.full.min.js');
        await loadScript('./app-core.js?v=20261012-1');
        await loadScript('./financial-model.js?v=20261012-1');
        await loadScript('./sac-engine.js?v=20261012-1');
        await loadScript('./sac-adapter.js?v=20261012-1');
        await loadScript('./app.js?v=20261012-1');
        await loadScript('./app-enhancements.js?v=20261012-1');
        await loadScript('./construction-finance.js?v=20261012-1');
        await loadScript('./integration-ui.js?v=20261012-1');
        await loadScript('./interaction-state.js?v=20261012-1');
      }
    });
  </script>
<link rel="stylesheet" href="enhancements.css?v=20261012-1">
</head>
<body>
  <p class="auth-progress">Conectando à Microsoft…</p>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">CF</div>
      <div><strong>Controle das Finanças</strong><small>Visão particular</small></div>
    </div>
    <nav id="nav" aria-label="Navegação principal"></nav>
    <div class="privacy-note"><span>●</span> Seus dados ficam neste navegador ou no seu OneDrive.</div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button id="menuButton" class="icon-button mobile-only" aria-label="Abrir menu">☰</button>
      <div>
        <p class="eyebrow">CONTROLE PESSOAL</p>
        <h1 id="pageTitle">Painel financeiro</h1>
      </div>
      <div class="top-actions">
        <span id="accountBadge" class="account-badge">Microsoft desconectado</span>
        <button class="primary" id="quickImport">Importar</button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="fileInput" type="file" accept=".xlsx,.xlsm,.xls,.csv" multiple hidden>
</body>
</html>
