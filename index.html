<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d1b2a">
  <meta name="description" content="Controle particular de despesas, patrimônio, investimentos e empréstimos.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=20261018-balanced">
  <link rel="stylesheet" href="./month-pivot.css?v=20261022-years">
  <link rel="stylesheet" href="./financial-charts.css?v=20261024-filtered">
  <title>Controle das Finanças</title>
  <script>
    const loadScript=src=>new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=reject;document.head.appendChild(script)});
    window.addEventListener('unhandledrejection',event=>{const view=document.getElementById('view');if(view&&!view.querySelector('article'))view.textContent='A abertura não foi concluída. Seus dados locais foram preservados. Recarregue a página. Detalhe: '+(event.reason?.message||'Erro de inicialização.');});
    window.addEventListener('DOMContentLoaded',async()=>{
      try{
      const authResponse=window.opener&&/(?:[?#&])(?:code|error|error_description)=/i.test(window.location.href);
      if(authResponse){
        document.title='Conectando à Microsoft';
        document.documentElement.classList.add('auth-bridge');
        await loadScript('./vendor/msal-redirect-bridge.min.js');
        await window.msalRedirectBridge.broadcastResponseToMainFrame();
      }else{
        await Promise.all([loadScript('./vendor/msal-browser.min.js'),loadScript('./vendor/xlsx.full.min.js')]);
        await loadScript('./app-core.js?v=20261022-daily-range');
        await loadScript('./financial-model.js?v=20261021-no-card-marker');
        await loadScript('./transaction-entry.js?v=20261021-entry');
        await loadScript('./sac-engine.js?v=20261025-audit');
        await loadScript('./sac-adapter.js?v=20261018-balanced');
        await loadScript('./app.js?v=20261021-entry');
        await loadScript('./app-enhancements.js?v=20261022-daily-range');
        await loadScript('./construction-finance.js?v=20261018-balanced');
        await loadScript('./integration-ui.js?v=20261025-audit');
        await loadScript('./finance-bridge.js?v=20261019-fgts-balance');
        await loadScript('./construction-migration.js?v=20261025-audit');
        await loadScript('./construction-drafts.js?v=20261025-sessions');
        await loadScript('./construction-host.js?v=20261025-sessions');
        await loadScript('./payroll-core.js?v=20261018-balanced');
        await loadScript('./statement-core.js?v=20261018-imports');
        await loadScript('./report-center.js?v=20261024-all-import-auth');
        await loadScript('./base-reconciliation.js');
        await loadScript('./app-state.js?v=20261018-balanced');
        await loadScript('./patrimony-model.js?v=20261021-cash-first');
        await loadScript('./patrimony-ui.js?v=20261021-indexed');
        await loadScript('./app-refinement.js?v=20261025-sessions');
        await loadScript('./reserve-details.js?v=20261019-contractor');
        await loadScript('./settings-workspace.js?v=20261018-settings');
        await loadScript('./transfer-repair.js?v=20261018-transfers');
        await loadScript('./sidebar.js?v=20261019-sidebar');
        await loadScript('./minhas-financas-core.js?v=20261022-source-report');
        await loadScript('./minhas-financas-ui.js?v=20261022-auth-plugin');
        await loadScript('./transaction-workspace.js?v=20261021-entry');
        await loadScript('./month-pivot.js?v=20261022-years');
        await loadScript('./financial-charts.js?v=20261024-filtered');
        await loadScript('./month-inputs.js?v=20261024-focus');
        await loadScript('./interaction-state.js?v=20261024-focus');
      }
      }catch(error){const view=document.getElementById('view');if(view)view.textContent='Não foi possível carregar o aplicativo. Seus dados locais não foram apagados. Recarregue a página. Detalhe: '+error.message;console.error(error)}
    });
  </script>
<link rel="stylesheet" href="enhancements.css?v=20261021-sticky">
<link rel="stylesheet" href="construction.css?v=20261018-reserve-view">
<link rel="stylesheet" href="reports.css?v=20261018-balanced">
<link rel="stylesheet" href="sidebar.css?v=20261019-sidebar">
</head>
<body>
  <p class="auth-progress">Conectando à Microsoft…</p>
  <aside class="sidebar">
    <button id="menuButton" class="sidebar-toggle" aria-label="Retrair menu" aria-controls="nav" aria-expanded="true">☰</button>
    <div class="brand">
      <div class="brand-mark">CF</div>
      <div><strong>Controle das Finanças</strong><small>Visão particular</small></div>
    </div>
    <nav id="nav" aria-label="Navegação principal"></nav>
    <div class="privacy-note"><span>●</span> Seus dados ficam neste navegador ou no seu OneDrive.</div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">CONTROLE PESSOAL</p>
        <h1 id="pageTitle">Painel financeiro</h1>
      </div>
      <div class="top-actions">
        <span id="accountBadge" class="account-badge">Microsoft desconectado</span>
      </div>
    </header>
    <main id="view" tabindex="-1"><p role="status">Carregando o aplicativo e a base deste dispositivo…</p></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="fileInput" type="file" accept=".xlsx,.xlsm,.xls,.csv" multiple hidden>
</body>
</html>
